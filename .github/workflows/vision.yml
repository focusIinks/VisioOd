name: Vision API
run-name: "Vision: ${{ inputs.mode }} — ${{ inputs.image_name || 'image' }}"

# Frontend C — the GitHub Action worker.
#
# Triggered by Frontend B (the mediator) with the DECRYPTED Composio key
# passed as an input. The key is used in-memory only (not printed, not logged).
#
# Flow: Frontend A (encrypts key) → Frontend B (decrypts, triggers this) → C (uses key)

on:
  workflow_dispatch:
    inputs:
      image_url:
        description: "Raw URL where the image is hosted (e.g. a raw gist URL)"
        required: true
      mime_type:
        description: "Image MIME type"
        required: false
        default: "image/png"
      mode:
        description: "Pipeline mode: all | validate | annotate | diagnose"
        required: false
        default: "all"
      clinical_context:
        description: "Optional clinical context"
        required: false
        default: ""
      image_name:
        description: "Image filename"
        required: false
        default: "uploaded.png"
      composio_key:
        description: "Decrypted Composio API key (from Frontend B)"
        required: true

permissions:
  contents: write
  actions: read

jobs:
  vision:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run vision pipeline
        env:
          # Use the decrypted key passed from Frontend B.
          # Falls back to the repo secret if the input is empty.
          COMPOSIO_API_KEY: ${{ inputs.composio_key || secrets.COMPOSIO_API_KEY }}
        run: |
          node src/vision.js \
            --image-url "${{ inputs.image_url }}" \
            --mime-type "${{ inputs.mime_type }}" \
            --mode "${{ inputs.mode }}" \
            --clinical-context "${{ inputs.clinical_context }}" \
            --name "${{ inputs.image_name }}" \
            --output result.json

      - name: Upload result artifact
        uses: actions/upload-artifact@v4
        with:
          name: vision-result-${{ github.run_id }}
          path: result.json
          retention-days: 30

      - name: Commit result to repo (for CORS-accessible download)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p results
          cp result.json "results/${{ github.run_id }}.json"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "results/${{ github.run_id }}.json"
          git commit -m "Result for run ${{ github.run_id }}"
          git push

      - name: Output
        run: |
          echo "::notice::Vision pipeline complete. Run ID: ${{ github.run_id }}"
          echo "=== RESULT ==="
          cat result.json | head -50
