name = "visiood-mediator"
main = "index.js"
compatibility_date = "2024-09-23"

# Secrets (set via `npx wrangler secret put`):
#   GITHUB_TOKEN      — GitHub PAT with repo/workflow scope
#   COMPOSIO_API_KEY  — Composio API key (ck_...)
#   API_KEY           — (optional) shared secret your frontend sends as Bearer token
#
# After deploying, you'll get a URL like:
#   https://visiood-mediator.<your-subdomain>.workers.dev
#
# That URL is what your static frontend calls. No tokens in the frontend!
