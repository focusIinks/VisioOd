<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VisioOd — Ophthalmic Annotation API</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #e2e8f0; line-height: 1.6; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem; }
    .container { max-width: 600px; text-align: center; }

    .links { display: flex; flex-direction: column; gap: 0.75rem; }
    a { display: block; padding: 0.9rem 1.5rem; border-radius: 10px; text-decoration: none; font-weight: 600; transition: transform 0.15s; }
    a:hover { transform: translateY(-2px); }
    .primary { background: #0d9488; color: white; }
    .secondary { background: #1e293b; color: #e2e8f0; border: 1px solid #334155; }

</head>

    <div class="links">

      <a class="secondary" href="https://github.com/focusIinks/VisioOd">📦 View Source on GitHub</a>

    <div class="ready">
      ✅ Ready to use — all keys are embedded. No setup required.
    </div>

    <footer>VisioOd API · <a href="https://github.com/focusIinks/VisioOd" style="color:#475569;">github.com/focusIinks/VisioOd</a></footer>
